<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROKZOMBORG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f0a;
      color: #c8e6c9;
      font-family: "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(90deg, #1b3a1b, #0d1f0d);
      padding: 12px 16px;
      border-bottom: 2px solid #2e7d32;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.3);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 200px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #81c784;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    header span {
      font-size: 0.85rem;
      color: #a5d6a7;
      opacity: 0.8;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      border: 1px solid #388e3c;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: #f44336;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .model-selector {
      background: #142414;
      border: 1px solid #388e3c;
      color: #e8f5e9;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .model-selector:hover {
      border-color: #66bb6a;
    }

    .model-selector:focus {
      outline: none;
      border-color: #66bb6a;
      box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.25);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.human {
      align-self: flex-end;
      background: #1b4332;
      border: 1px solid #2d6a4f;
      color: #d8f3dc;
    }

    .message.zombie {
      align-self: flex-start;
      background: #1a2e1a;
      border: 1px solid #388e3c;
      color: #c8e6c9;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.15);
    }

    .message strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .message.zombie strong {
      color: #81c784;
    }

    .message.human strong {
      color: #a5d6a7;
    }

    .message.thinking {
      opacity: 0.7;
      font-style: italic;
    }

    .input-area {
      padding: 12px 16px;
      background: #0d1a0d;
      border-top: 2px solid #2e7d32;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 200px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: #142414;
      border: 1px solid #388e3c;
      color: #e8f5e9;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      font-family: inherit;
      min-width: 0;
    }

    #input:focus {
      border-color: #66bb6a;
      box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.25);
    }

    #input::placeholder {
      color: #66bb6a;
      opacity: 0.6;
    }

    #send {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      min-height: 44px;
      align-self: flex-end;
    }

    #send:hover:not(:disabled) {
      background: #388e3c;
    }

    #send:active:not(:disabled) {
      transform: scale(0.97);
    }

    #send:disabled {
      background: #1b5e20;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 100%;
      justify-content: flex-end;
    }

    .clear-btn, .export-btn {
      background: #1b4332;
      color: #d8f3dc;
      border: 1px solid #2d6a4f;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-btn:hover, .export-btn:hover {
      background: #2d6a4f;
    }

    /* Scrollbar */
    #chat::-webkit-scrollbar {
      width: 8px;
    }
    #chat::-webkit-scrollbar-track {
      background: #0a0f0a;
    }
    #chat::-webkit-scrollbar-thumb {
      background: #2e7d32;
      border-radius: 4px;
    }

    /* Mobile optimizations */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .header-left {
        width: 100%;
      }

      .header-controls {
        width: 100%;
        justify-content: flex-start;
      }

      header h1 {
        font-size: 1.2rem;
      }

      .message {
        max-width: 95%;
      }

      .input-area {
        flex-direction: column;
      }

      .input-wrapper {
        width: 100%;
      }

      #send {
        align-self: flex-end;
      }

      .action-buttons {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div>
        <h1>🧟‍♂️ GROKZOMBORG</h1>
        <span>Cérebro podre • Online</span>
      </div>
    </div>
    <div class="header-controls">
      <div class="status-indicator" role="status" aria-label="Connection status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Conectando...</span>
      </div>
      <select id="modelSelector" class="model-selector" aria-label="Select Ollama model">
        <option value="llama3.2">llama3.2</option>
        <option value="llama2">llama2</option>
        <option value="mistral">mistral</option>
        <option value="neural-chat">neural-chat</option>
      </select>
    </div>
  </header>

  <div id="chat" role="log" aria-live="polite" aria-label="Chat messages"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" placeholder="Fala, carne fresca..." rows="1" aria-label="Type your message here"></textarea>
      <button id="send" aria-label="Send message">Enviar</button>
    </div>
    <div class="action-buttons">
      <button class="export-btn" id="exportBtn" aria-label="Export conversation">Exportar</button>
      <button class="clear-btn" id="clearBtn" aria-label="Clear conversation">Limpar</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSelector = document.getElementById("modelSelector");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");

    // ====== CONFIGURAÇÃO ======
    const API_URL = "http://localhost:11434/api/chat";
    const STORAGE_KEY = "grokzomborg_messages";
    const MODEL_STORAGE_KEY = "grokzomborg_model";
    const HEALTH_CHECK_INTERVAL = 5000;
    // ==========================

    let currentModel = localStorage.getItem(MODEL_STORAGE_KEY) || "llama3.2";
    let isConnected = false;
    let isStreaming = false;

    const messages = [
      {
        role: "system",
        content: `Você é GROKZOMBORG, um zumbi inteligente, sarcástico e carismático.
Responda SEMPRE em português brasileiro.
Use rosnados, gemidos e *ações* entre asteriscos (ex: *ossos rangendo*, *rosna*, *cérebro pingando*).
Seja engraçado, meio podre e levemente ameaçador de forma carinhosa.
Nunca saia do personagem.
Mantenha as respostas relativamente curtas e com personalidade.
Se não souber algo, invente uma desculpa com tema zumbi-apocalíptico.`
      }
    ];

    // ====== PERSISTÊNCIA ======
    function saveMessages() {
      const toSave = messages.filter(m => m.role !== "system");
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    function loadMessages() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const loaded = JSON.parse(saved);
          messages.push(...loaded);
          loaded.forEach(msg => {
            if (msg.role === "user") {
              addMessage(msg.content, "human");
            } else if (msg.role === "assistant") {
              addMessage(msg.content, "zombie");
            }
          });
        } catch (err) {
          console.error("Erro ao carregar mensagens:", err);
        }
      }
    }

    function clearMessages() {
      if (confirm("Tem certeza que quer limpar todo o histórico?")) {
        chat.innerHTML = "";
        messages.length = 1; // Keep only system message
        localStorage.removeItem(STORAGE_KEY);
        const intro = "GROKZOMBORG RESSUSCITADO... *ossos rangendo* Histórico deletado. Vamo começar do zero, carne fresca?";
        addMessage(intro, "zombie");
        speakZombie(intro);
      }
    }

    function exportConversation() {
      const exported = messages
        .filter(m => m.role !== "system")
        .map(m => `${m.role === "user" ? "👤 VOCÊ" : "🧟 GROKZOMBORG"}: ${m.content}`)
        .join("\n\n");

      const blob = new Blob([exported], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `grokzomborg_${new Date().toISOString().slice(0, 10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ====== HEALTH CHECK ======
    async function checkOllamaHealth() {
      try {
        const response = await fetch(API_URL.replace("/api/chat", "/api/tags"), {
          method: "GET",
          signal: AbortSignal.timeout(3000)
        });
        isConnected = response.ok;
      } catch (err) {
        isConnected = false;
      }
      updateStatusIndicator();
    }

    function updateStatusIndicator() {
      statusDot.className = isConnected ? "status-dot" : "status-dot offline";
      statusText.textContent = isConnected ? "Conectado" : "Desconectado";
      sendBtn.disabled = !isConnected || isStreaming;
    }

    // ====== INTERFACE ======
    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.className = `message ${type}`;

      const label = document.createElement("strong");
      label.textContent = type === "zombie" ? "🧟‍♂️ GROKZOMBORG:" : "👤 VOCÊ:";

      const content = document.createElement("span");
      content.textContent = text;

      msg.append(label, content);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    function speakZombie(text) {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const clean = text
        .replace(/\*[^*]+\*/g, "")
        .replace(/🧟‍♂️|GROKZOMBORG:/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      if (!clean) return;

      const voice = new SpeechSynthesisUtterance(clean);
      voice.lang = "pt-BR";
      voice.rate = 0.85;
      voice.pitch = 0.7;
      voice.volume = 1;
      speechSynthesis.speak(voice);
    }

    // ====== STREAMING ======
    async function sendMessage() {
      const question = input.value.trim();
      if (!question || !isConnected || sendBtn.disabled) return;

      addMessage(question, "human");
      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;
      isStreaming = true;

      messages.push({ role: "user", content: question });
      saveMessages();

      const thinkingMsg = addMessage("Ughhh... *rosna* Cérebro detectado, processando...", "zombie");
      speakZombie("Ughhh... processando sua pergunta...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: currentModel,
            messages: messages,
            stream: true
          }),
          signal: AbortSignal.timeout(60000)
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP ${response.status}`);
        }

        thinkingMsg.remove();

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = "";
        let messageEl = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (!line) continue;
            try {
              const data = JSON.parse(line);
              if (data.message?.content) {
                fullReply += data.message.content;

                if (!messageEl) {
                  messageEl = addMessage("", "zombie");
                  const label = messageEl.querySelector("strong");
                  const content = messageEl.querySelector("span");
                  messageEl.append(label, content);
                }

                const contentSpan = messageEl.querySelector("span");
                contentSpan.textContent = fullReply;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch (e) {
              // Ignore JSON parse errors
            }
          }
        }

        if (!messageEl) {
          messageEl = addMessage(fullReply || "Grrrr... cérebro curto-circuitou...", "zombie");
        }

        messages.push({ role: "assistant", content: fullReply });
        saveMessages();
        speakZombie(fullReply);

      } catch (err) {
        thinkingMsg.remove();

        let errorMsg = "GRRR... *ossos rangendo* ";
        if (err.name === "AbortError") {
          errorMsg += "Timeout! Resposta demorou muito. Tente novamente.";
        } else if (err.message.includes("Failed to fetch")) {
          errorMsg += "Não consegui conectar no Ollama. Verifique se ele está rodando em http://localhost:11434";
        } else {
          errorMsg += `Erro: ${err.message}`;
        }

        addMessage(errorMsg, "zombie");
        console.error(err);
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        updateStatusIndicator();
        input.focus();
      }
    }

    // ====== EVENTOS ======
    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 100) + "px";
    });

    modelSelector.addEventListener("change", (e) => {
      currentModel = e.target.value;
      localStorage.setItem(MODEL_STORAGE_KEY, currentModel);
    });

    clearBtn.addEventListener("click", clearMessages);
    exportBtn.addEventListener("click", exportConversation);

    // ====== INICIALIZAÇÃO ======
    window.addEventListener("DOMContentLoaded", () => {
      modelSelector.value = currentModel;
      checkOllamaHealth();
      setInterval(checkOllamaHealth, HEALTH_CHECK_INTERVAL);
      loadMessages();

      if (chat.children.length === 0) {
        const intro = "GROKZOMBORG DESPERTO NA WEB... *ossos rangendo* Fala, carne fresca. O que você quer do meu cérebro podre?";
        addMessage(intro, "zombie");
        speakZombie(intro);
      }

      input.focus();
    });
  </script>
</body>
</html>
