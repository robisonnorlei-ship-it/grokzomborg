<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROKZOMBORG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f0a;
      color: #c8e6c9;
      font-family: "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(90deg, #1b3a1b, #0d1f0d);
      padding: 12px 16px;
      border-bottom: 2px solid #2e7d32;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.3);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 200px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #81c784;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    header span {
      font-size: 0.85rem;
      color: #a5d6a7;
      opacity: 0.8;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      border: 1px solid #388e3c;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: #f44336;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .model-selector {
      background: #142414;
      border: 1px solid #388e3c;
      color: #e8f5e9;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .model-selector:hover {
      border-color: #66bb6a;
    }

    .model-selector:focus {
      outline: none;
      border-color: #66bb6a;
      box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.25);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.human {
      align-self: flex-end;
      background: #1b4332;
      border: 1px solid #2d6a4f;
      color: #d8f3dc;
    }

    .message.zombie {
      align-self: flex-start;
      background: #1a2e1a;
      border: 1px solid #388e3c;
      color: #c8e6c9;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.15);
    }

    .message strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .message.zombie strong {
      color: #81c784;
    }

    .message.human strong {
      color: #a5d6a7;
    }

    .message.thinking {
      opacity: 0.7;
      font-style: italic;
    }

    .input-area {
      padding: 12px 16px;
      background: #0d1a0d;
      border-top: 2px solid #2e7d32;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 200px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: #142414;
      border: 1px solid #388e3c;
      color: #e8f5e9;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      font-family: inherit;
      min-width: 0;
    }

    #input:focus {
      border-color: #66bb6a;
      box-shadow: 0 0 0 2px rgba(102, 187, 106, 0.25);
    }

    #input::placeholder {
      color: #66bb6a;
      opacity: 0.6;
    }

    #send {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      min-height: 44px;
      align-self: flex-end;
    }

    #send:hover:not(:disabled) {
      background: #388e3c;
    }

    #send:active:not(:disabled) {
      transform: scale(0.97);
    }

    #send:disabled {
      background: #1b5e20;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 100%;
      justify-content: flex-end;
    }

    .clear-btn, .export-btn {
      background: #1b4332;
      color: #d8f3dc;
      border: 1px solid #2d6a4f;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-btn:hover, .export-btn:hover {
      background: #2d6a4f;
    }

    #chat::-webkit-scrollbar {
      width: 8px;
    }
    #chat::-webkit-scrollbar-track {
      background: #0a0f0a;
    }
    #chat::-webkit-scrollbar-thumb {
      background: #2e7d32;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .header-left {
        width: 100%;
      }

      .header-controls {
        width: 100%;
        justify-content: flex-start;
      }

      header h1 {
        font-size: 1.2rem;
      }

      .message {
        max-width: 95%;
      }

      .input-area {
        flex-direction: column;
      }

      .input-wrapper {
        width: 100%;
      }

      #send {
        align-self: flex-end;
      }

      .action-buttons {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div>
        <h1>🧟‍♂️ GROKZOMBORG</h1>
        <span>Cérebro podre • Online</span>
      </div>
    </div>
    <div class="header-controls">
      <div class="status-indicator" role="status" aria-label="Connection status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Conectando...</span>
      </div>
      <select id="modelSelector" class="model-selector" aria-label="Select Ollama model">
        <option value="llama3.2">llama3.2</option>
        <option value="llama2">llama2</option>
        <option value="mistral">mistral</option>
        <option value="neural-chat">neural-chat</option>
      </select>
    </div>
  </header>

  <div id="chat" role="log" aria-live="polite" aria-label="Chat messages"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" placeholder="Fala, carne fresca..." rows="1" aria-label="Type your message here"></textarea>
      <button id="send" aria-label="Send message">Enviar</button>
    </div>
    <div class="action-buttons">
      <button class="export-btn" id="exportBtn" aria-label="Export conversation">Exportar</button>
      <button class="clear-btn" id="clearBtn" aria-label="Clear conversation">Limpar</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSelector = document.getElementById("modelSelector");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");

    const STORAGE_KEY = "grokzomborg_messages";
    const MODEL_STORAGE_KEY = "grokzomborg_model";
    const API_STORAGE_KEY = "grokzomborg_api_url";
    const DEFAULT_MODELS = ["llama3.2", "llama2", "mistral", "neural-chat"];
    const DEFAULT_API_URL = "http://localhost:11434";
    const SYSTEM_PROMPT = `Você é GROKZOMBORG, um zumbi inteligente, sarcástico e carismático.
Responda SEMPRE em português brasileiro.
Use rosnados, gemidos e *ações* entre asteriscos (ex: *ossos rangendo*, *rosna*, *cérebro pingando*).
Seja engraçado, meio podre e levemente ameaçador de forma carinhosa.
Nunca saia do personagem.
Mantenha as respostas relativamente curtas e com personalidade.
Se não souber algo, invente uma desculpa com tema zumbi-apocalíptico.`;

    let currentModel = getStoredValue(MODEL_STORAGE_KEY, "llama3.2");
    let isConnected = false;
    let isStreaming = false;
    let messages = [{ role: "system", content: SYSTEM_PROMPT }];

    function getStoredValue(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value !== null && value !== undefined ? value : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function getApiBaseUrl() {
      return getStoredValue(API_STORAGE_KEY, DEFAULT_API_URL).replace(/\/$/, "");
    }

    function normalizeContent(value) {
      return typeof value === "string" ? value : "";
    }

    function persistMessages() {
      const history = messages
        .filter((message) => message.role !== "system")
        .map((message) => ({
          role: message.role,
          content: normalizeContent(message.content)
        }));

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (error) {
        console.warn("Não foi possível salvar mensagens:", error);
      }
    }

    function loadMessages() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return;

        messages = [{ role: "system", content: SYSTEM_PROMPT }];

        parsed.forEach((message) => {
          if (message && (message.role === "user" || message.role === "assistant")) {
            messages.push({
              role: message.role,
              content: normalizeContent(message.content)
            });
          }
        });

        renderMessages();
      } catch (error) {
        console.error("Erro ao carregar mensagens:", error);
        messages = [{ role: "system", content: SYSTEM_PROMPT }];
      }
    }

    function renderMessages() {
      chat.innerHTML = "";
      const history = messages.filter((message) => message.role !== "system");

      if (!history.length) {
        addMessage("GROKZOMBORG DESPERTO NA WEB... *ossos rangendo* Fala, carne fresca. O que você quer do meu cérebro podre?", "zombie");
        return;
      }

      history.forEach((message) => {
        addMessage(message.content, message.role === "user" ? "human" : "zombie");
      });
    }

    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.className = `message ${type}`;

      const label = document.createElement("strong");
      label.textContent = type === "zombie" ? "🧟‍♂️ GROKZOMBORG:" : "👤 VOCÊ:";

      const content = document.createElement("span");
      content.textContent = text || "";

      msg.append(label, content);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    function speakZombie(text) {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const clean = String(text || "")
        .replace(/\*[^*]+\*/g, "")
        .replace(/🧟‍♂️|GROKZOMBORG:/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      if (!clean) return;

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = "pt-BR";
      utterance.rate = 0.85;
      utterance.pitch = 0.7;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function updateStatusIndicator() {
      statusDot.className = isConnected ? "status-dot" : "status-dot offline";
      statusText.textContent = isConnected ? "Conectado" : "Desconectado";
      sendBtn.disabled = !isConnected || isStreaming;
    }

    function populateModelSelector(models) {
      const available = Array.isArray(models) && models.length ? models : DEFAULT_MODELS;
      const unique = [...new Set(available.map((model) => String(model).trim()).filter(Boolean))];

      modelSelector.innerHTML = "";
      unique.forEach((model) => {
        const option = document.createElement("option");
        option.value = model;
        option.textContent = model;
        modelSelector.appendChild(option);
      });

      if (!unique.includes(currentModel)) {
        currentModel = unique[0] || "llama3.2";
      }

      modelSelector.value = currentModel;
      localStorage.setItem(MODEL_STORAGE_KEY, currentModel);
    }

    async function fetchAvailableModels() {
      try {
        const response = await fetch(`${getApiBaseUrl()}/api/tags`, {
          method: "GET",
          cache: "no-store",
          signal: AbortSignal.timeout(5000)
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const models = (data?.models || []).map((model) => model?.name || model?.model || "").filter(Boolean);
        populateModelSelector(models);
      } catch (error) {
        console.warn("Não foi possível listar modelos do Ollama, usando os padrão:", error);
        populateModelSelector(DEFAULT_MODELS);
      }
    }

    async function checkOllamaHealth() {
      try {
        const response = await fetch(`${getApiBaseUrl()}/api/tags`, {
          method: "GET",
          cache: "no-store",
          signal: AbortSignal.timeout(4000)
        });

        isConnected = response.ok;
      } catch (error) {
        isConnected = false;
      }

      updateStatusIndicator();
      if (isConnected) {
        await fetchAvailableModels();
      }
    }

    function clearMessages() {
      if (!confirm("Tem certeza que quer limpar todo o histórico?")) return;

      messages = [{ role: "system", content: SYSTEM_PROMPT }];
      localStorage.removeItem(STORAGE_KEY);
      renderMessages();
      const intro = "GROKZOMBORG RESSUSCITADO... *ossos rangendo* Histórico deletado. Vamo começar do zero, carne fresca?";
      addMessage(intro, "zombie");
      speakZombie(intro);
    }

    function exportConversation() {
      const exported = messages
        .filter((message) => message.role !== "system")
        .map((message) => `${message.role === "user" ? "👤 VOCÊ" : "🧟 GROKZOMBORG"}: ${message.content}`)
        .join("\n\n");

      const blob = new Blob([exported || ""], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `grokzomborg_${new Date().toISOString().slice(0, 10)}.txt`;
      anchor.click();
      URL.revokeObjectURL(url);
    }

    async function sendMessage() {
      const question = input.value.trim();
      if (!question || !isConnected || isStreaming) return;

      const prompt = question.replace(/\s+/g, " ").trim();
      addMessage(prompt, "human");
      messages.push({ role: "user", content: prompt });
      persistMessages();

      input.value = "";
      input.style.height = "auto";
      isStreaming = true;
      sendBtn.disabled = true;

      const thinkingMessage = addMessage("Ughhh... *rosna* Cérebro detectado, processando...", "zombie");
      speakZombie("Ughhh... processando sua pergunta...");

      try {
        const response = await fetch(`${getApiBaseUrl()}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: currentModel,
            messages: messages,
            stream: true
          }),
          signal: AbortSignal.timeout(120000)
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP ${response.status}`);
        }

        if (!response.body) {
          throw new Error("Sem corpo na resposta do Ollama.");
        }

        thinkingMessage.remove();

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullReply = "";
        let replyMessage = addMessage("", "zombie");
        const replyContent = replyMessage.querySelector("span");

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split(/\r?\n/);
          buffer = chunks.pop() || "";

          for (const chunk of chunks) {
            const raw = chunk.trim();
            if (!raw || raw === "[DONE]") continue;

            let payload = raw;
            if (payload.startsWith("data:")) {
              payload = payload.slice(5).trim();
            }

            if (!payload) continue;

            try {
              const parsed = JSON.parse(payload);
              const content = normalizeContent(parsed?.message?.content);

              if (content) {
                fullReply += content;
                replyContent.textContent = fullReply;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch (error) {
              console.warn("Chunk ignorado do stream:", raw);
            }
          }
        }

        if (!fullReply.trim()) {
          fullReply = "Grrr... *cérebro em curto* a resposta foi perdida na poeira zumbi.";
        }

        replyContent.textContent = fullReply;
        chat.scrollTop = chat.scrollHeight;

        messages.push({ role: "assistant", content: fullReply });
        persistMessages();
        speakZombie(fullReply);
      } catch (error) {
        thinkingMessage.remove();

        let errorText = "GRRR... *ossos rangendo* ";

        if (error.name === "AbortError") {
          errorText += "Timeout! A resposta demorou muito. Tente novamente.";
        } else if (String(error.message).includes("Failed to fetch") || String(error.message).includes("fetch")) {
          errorText += "Não consegui conectar ao Ollama. Verifique se ele está rodando em http://localhost:11434";
        } else {
          errorText += `Erro: ${error.message}`;
        }

        addMessage(errorText, "zombie");
        console.error(error);
      } finally {
        isStreaming = false;
        sendBtn.disabled = !isConnected;
        updateStatusIndicator();
        input.focus();
      }
    }

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 100) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", clearMessages);
    exportBtn.addEventListener("click", exportConversation);

    modelSelector.addEventListener("change", (event) => {
      currentModel = event.target.value;
      localStorage.setItem(MODEL_STORAGE_KEY, currentModel);
    });

    window.addEventListener("DOMContentLoaded", async () => {
      modelSelector.value = currentModel;
      await checkOllamaHealth();
      setInterval(checkOllamaHealth, 5000);
      loadMessages();
      input.focus();
    });
  </script>
</body>
</html>
